org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---------- Keep these in lockstep with ClaimViz / SimDistance — same MC/Yarn/Fabric target ----------
# Bumping to a new Minecraft version should be an edit to *this block only*. The mod deliberately
# uses no mixins and routes version-volatile render calls through net.containerutil.compat.RenderCompat,
# so a 26.x bump is: change these five lines, then fix whatever RenderCompat complains about.
# Find Yarn builds at: https://fabricmc.net/develop/
minecraft_version=26.1.2
loader_version=0.19.3
fabric_version=0.155.2+26.1.2
# ----------------------------------------------------------------------------------------------------

# Soft dependency versions — must match what's available for the MC version above
# ModMenu releases: https://modrinth.com/mod/modmenu/versions
# Cloth Config releases: https://modrinth.com/mod/cloth-config/versions
modmenu_version=18.0.0
cloth_config_version=26.1.154+fabric
# Compile-only; matches the basic-math jar-in-jar that cloth-config already ships.
basic_math_version=0.6.1
trarncore_version=1.2.0

mod_version=0.2.0
maven_group=net.containerutil
archives_base_name=containerutil
