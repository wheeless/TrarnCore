# Shared version pins for every mod in MinecraftMods/.
#
# This is the single place a Minecraft bump happens. Each mod's build.gradle reads this file and
# falls back to its own gradle.properties if it is missing, so a mod copied out of this directory
# on its own still builds.
#
# Find Yarn builds at: https://fabricmc.net/develop/
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_version=0.141.4+1.21.11

# Soft dependency versions — must match what's available for the Minecraft version above.
# ModMenu releases:      https://modrinth.com/mod/modmenu/versions
# Cloth Config releases: https://modrinth.com/mod/cloth-config/versions
modmenu_version=17.0.0
cloth_config_version=21.11.153+fabric

# Compile-only; matches the basic-math jar-in-jar that cloth-config already ships.
basic_math_version=0.6.1

# The shared library every mod here depends on, bundled via jar-in-jar.
trarncore_version=1.1.0
